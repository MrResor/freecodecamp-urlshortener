services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "10002:3000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    volumes:
      - /home/ubuntu/running/logs/freecodecamp-urlshortener:/program/logs
    environment:
      NODE_ENV: production

  db:
    image: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - freecodecamp-urlshortener-pg:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USER_LOGIN} -d url_shortener" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

volumes:
  freecodecamp-urlshortener-pg:
    external: true